services:
  - type: web
    name: cineadmin-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: cineadmin-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
